<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parroquia</title>
    <!-- Enlace a tu hoja de estilos externa -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="navbar">
        <!-- Logo -->
        <div class="logo-container">
            <a href="#">
                <img src="img/isologotipo chico.jpg" alt="Logo Parroquia">
            </a>
        </div>

        <!-- Botón menú móvil -->
        <button class="menu-toggle" id="mobile-menu" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Botones de navegación -->
        <nav>
            <ul class="nav-links" id="nav-links">
                <li><a href="#misas">Misas</a></li>
                <li><a href="#oficina">Oficina</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- BANNER PRINCIPAL -->
    <section class="banner">
        <img src="img/banner.JPG" alt="Banner Parroquia">
    </section>

    <!-- CONTENEDOR DEL SLIDER AUTOMÁTICO -->
    <section class="slider-section">
        <div class="slider-container">
            <div class="slider-track">
                <!-- Imagen 1 -->
                <div class="slide">
                    <img src="img/iglesia1.jpg" alt="Iglesia 1">
                </div>
                <!-- Imagen 2 -->
                <div class="slide">
                    <img src="img/iglesia2.jpg" alt="Iglesia 2">
                </div>
                <!-- Imagen 3 -->
                <div class="slide">
                    <img src="img/iglesia3.png" alt="Iglesia 3">
                </div>
                <!-- Imagen 4 -->
                <div class="slide">
                    <img src="img/iglesia4.jpg" alt="Iglesia 4">
                </div>
            </div>
        </div>
    </section>

    <!-- JAVASCRIPT PARA EL MENÚ RESPONSIVO -->
    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');

        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });
    </script>

</body>
</html>
